# Dark Angel Hyprlock config for 2k monitor resolutions

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
source = $HOME/.local/state/dark-angel/hypr.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgb(3, 2, 4)
    blur_size = 6
    blur_passes = 3
    noise = 0.02
    contrast = 1.3000
    brightness = 0.3500
    vibrancy = 0.2000
    vibrancy_darkness = 0.40
}

label {
    monitor =
    text = ⛧  ABYSSAL PROTOCOL  ⛧
    color = $dark_angel_primary
    font_size = 22
    font_family = LXGW WenKai Bold
    position = 0, -165
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $dark_angel_text
    font_size = 148
    font_family = LXGW WenKai Bold
    position = 0, -28
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:18000000] echo "$(date +'%A, %-d %B')"
    color = $dark_angel_accent
    font_size = 20
    font_family = LXGW WenKai Bold
    position = 0, 102
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    color = $dark_angel_text
    font_size = 20
    font_family = LXGW WenKai
    position = 0, 205
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 360, 58
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.24
    dots_center = true
    dots_rounding = -1
    outer_color = $dark_angel_primary
    inner_color = rgba(7, 3, 5, 0.85)
    font_color = $dark_angel_primary
    check_color = $dark_angel_secondary
    fail_color = rgb(FF1E3C)
    capslock_color = $dark_angel_accent
    fade_on_empty = false
    font_family = LXGW WenKai
    placeholder_text = <i><span foreground="##8E001D">Enter credentials to appease the abyss...</span></i>
    fail_text = <i><span foreground="##FF1E3C">Sacrifice rejected (attempt $ATTEMPTS)</span></i>
    hide_input = false
    position = 0, 126
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $LAYOUT
    color = $dark_angel_secondary
    font_size = 12
    font_family = LXGW WenKai Bold
    position = 0, 82
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] echo "$(uptime -p || $Scripts/UptimeNixOS.sh)"
    color = $dark_angel_accent
    font_size = 15
    font_family = LXGW WenKai
    position = -36, 36
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo "$($Scripts/Battery.sh)"
    color = $dark_angel_accent
    font_size = 15
    font_family = LXGW WenKai
    position = -36, 66
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && cat "$HOME/.cache/.weather_cache"
    color = $dark_angel_accent
    font_size = 15
    font_family = LXGW WenKai
    position = 36, 36
    halign = left
    valign = bottom
}
