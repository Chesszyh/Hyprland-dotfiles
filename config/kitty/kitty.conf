# Dark Angel terminal profile

# Core palette
include ./kitty-themes/DarkAngel.conf

# Font
font_family FantasqueSansM Nerd Font Mono Bold
font_size 13.0
bold_font auto
italic_font auto
bold_italic_font auto
modify_font cell_height 115%

# Window appearance
window_padding_width 15
background_opacity 0.88
dynamic_background_opacity yes
confirm_os_window_close 0

active_border_color #ff1e3c
inactive_border_color #3a0a14
window_border_width 1pt
draw_minimal_borders yes

# Cursor and interaction
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_trail 3
cursor_trail_decay 0.15 0.45
cursor_trail_start_threshold 2
cursor_trail_color #b00028

# Tabs
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold
inactive_tab_font_style normal
active_tab_background #ff1e3c
active_tab_foreground #030204
inactive_tab_background #0d0306
inactive_tab_foreground #a77a81

# Interaction details
url_color #d51d3c
url_style curly
detect_urls yes
copy_on_select yes
mouse_hide_wait 3.0

# Performance and system integration
linux_display_server auto
repaint_delay 10
input_delay 3
sync_to_monitor yes
enable_audio_bell yes
scrollback_lines 10000
wheel_scroll_min_lines 1

# Window management
map ctrl+shift+enter new_window
map ctrl+shift+w close_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window

# Tab management
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Font sizing
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# Local session save and restore
allow_remote_control socket-only
listen_on unix:/tmp/kitty-session-${USER}-{kitty_pid}
map ctrl+shift+s launch --type=background sh -c 'exec "$HOME/.config/kitty/scripts/kitty-session-save.sh"'
map ctrl+shift+r launch --type=background sh -c 'exec "$HOME/.config/kitty/scripts/kitty-session-restore.sh"'

# Start new terminals as windows instead of restoring the last maximized state.
remember_window_size no
initial_window_width 960
initial_window_height 600
